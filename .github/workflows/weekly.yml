name: Weekly Ledger refresh

on:
  schedule:
    # Tuesdays at 11:00 UTC (6-7am Eastern), after Monday Night Football
    - cron: '0 11 * * 2'
  workflow_dispatch:

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Pull scores, write script, record voice
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE }}
          SLEEPER_LEAGUE_ID: ${{ vars.SLEEPER_LEAGUE_ID }}
        run: node refresh.mjs
      - name: Save results to the repo
        run: |
          git config user.name "ledger-bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add data audio
          if ! git diff --cached --quiet; then
            git commit -m "Weekly ledger refresh"
            git push
          fi
      - name: Tell GitHub Pages to rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds"
